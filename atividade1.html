<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade01</title>

    <style>
        table{
            border-collapse: collapse;
        }
        caption{
            font-family:'Times New Roman', Times, serif;
            font-weight: bold;
            font-size: 20px;
            color: black;
            margin-bottom: 20px;
        }
        .destacar{
            color: red;
        }
        td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
            
        }
        img{
            padding-left: 15px;
            padding-right: 15px;
        }
        th{
            font-family: 'Times New Roman', Times, serif;
            font-size: 22px;
            text-align: center;
           padding-bottom: 10px;
        }
        .distancia{
            padding-left: 10px;
        }
        .destacardois{
            color: blue;
        }
        .fonte{
            font-family: Arial, Helvetica, sans-serif;
        }
        .planetas{
            padding: 20px;
        }
        


    </style>
</head>
<body>
    <table>
        <caption>Distância em relação ao <span class="destacar">Sol</span></caption>
        <tr>
            <th>Planeta</th>
            <th>Nome</th>
            <th class="distancia">Distância</th>
        </tr>
        <tr>
            <td><img src="imagens/Imagem colada.png" alt="terra" width="100px"></td>
            <td class="planetas">Terra</td>
            <td class="destacardois fonte">1 AU</td>
        </tr>
        <tr>
            <td><img src="imagens/Imagem colada (2).png" alt="venus" width="100px"></td>
            <td class="planetas">Vênus</td>
            <td class="fonte">0.75 AU</td>
        </tr>
        <tr>
            <td><img src="imagens/Imagem colada (3).png" alt="marte" width="100px"></td>
            <td class="planetas">Marte</td>
            <td class="fonte">1.52 AU</td>
        </tr>
        <tr>
            <td><img src="imagens/Imagem colada (4).png" alt="jupiter" width="100px"></td>
            <td class="planetas">Jupiter</td>
            <td class="fonte">5.20 AU</td>
        </tr>
        <tr>
            <td><img src="imagens/Imagem colada (5).png" alt="saturno" width="100px"></td>
            <td class="planetas">Saturno</td>
            <td class="fonte">9.58 AU</td>
        </tr>
    </table>
    
</body>
</html>
