<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade03</title>

    <style>
        .opcao{
            border: 1px solid grey;
            height: 200px;
            width: 400px;
        }
        h1{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        .quadrado{
            margin: auto;
            background-color: red;
            height: 50px;
            width: 50px;
            border: 1px solid gray;
        }
        .blocoText{
            border: 1px solid grey;
            height: 200px;
            width: 400px;
            
        }

    </style>
</head>
<body>
    <div class="opcao" >
        <h1>Opções de cores</h1>
        <div class="quadrado" onmouseover="mudarCor('red')"></div>
    </div>
    <div class="blocoText" id="primeiro">
        <span>
            1.Lorem, ipsum dolor sit amet consectetur adipisicing elit. Amet sit ex pariatur ad! Dolorem necessitatibus cupiditate quidem eos, adipisci voluptatem nostrum quia dicta excepturi, a rerum, eveniet corporis odio harum!
        </span>
    </div>


    <script>
        const primeiroBloco = document.getElementById("primeiro");
        function mudarCor(cor){
            primeiroBloco.style.backgroundColor = cor;
        }
    </script>
</body>
</html>
